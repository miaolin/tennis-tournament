// Another open tab of the site found changes, or followed someone: show them here too.
window.addEventListener("storage", (e) => {
  if (e.key === "playerAlerts") { state.alerts = saved.get("playerAlerts", []); renderAlerts(); }
  if (e.key === FOLLOW_ALERTS) { state.followAlerts = saved.get(FOLLOW_ALERTS, []); renderFollowAlerts(); }
  if (e.key === "followedPlayers") { state.follow = saved.get("followedPlayers", []); renderFollow(); if (state.view !== "players") render(); }
});

// ---------------------------------------------------------------- Followed players
// Follow a player from the Players tab's dropdown of this year's players, or with the ☆ next to their name in
// any player list. The tab shows every tournament of the year each followed player is entered in (singles or
// doubles, draw, seed): the ones in progress or still to come, then the ones played. It loads every player list
// of the year; finished tournaments' lists never change, so they're kept in this browser, and the rest are
// reloaded once an hour while the site is open. Followed players are kept in this browser only.
state.follow = saved.get("followedPlayers", []); // [{ name, tour }]; tour "" (from earlier versions) matches either tour
state.trace = { at: 0, count: 0, done: 0, lists: new Map() }; // lists: key → { t, p }
let tracing = false;

const normed = new Map();
const norm = (s) => normed.get(s) ?? normed.set(s, String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim()).get(s);
const followMatch = (f, tour, name) => (!f.tour || f.tour === tour) && norm(f.name) === norm(name);
const isFollowed = (tour, name) => state.follow.some((f) => followMatch(f, tour, name));
function star(tour, n) {
  const on = isFollowed(tour, n), label = `${on ? "Unfollow" : "Follow"} ${n}`;
  return `<button class="star${on ? " on" : ""}" data-star="${esc(n)}" data-tour="${esc(tour)}" aria-pressed="${on}" title="${esc(label)}" aria-label="${esc(label)}">${on ? "★" : "☆"}</button>`;
}

// Player lists known: the year's scan, then lists opened on this visit (fresher) of tournaments not yet finished.
function knownLists() {
  const now = localDay(new Date()), lists = new Map(state.trace.lists);
  for (const [k, p] of state.players) {
    const t = p.singles && state.tournaments.find((x) => key(x) === k);
    if (t && t.endDate >= now) lists.set(k, { t, p });
  }
  return lists;
}

function followedIn(t) {
  if (!state.follow.length) return [];
  const p = state.players.get(key(t))?.singles ? state.players.get(key(t)) : state.trace.lists.get(key(t))?.p;
  return !p ? [] : [...new Set([...p.singles, ...p.doubles].flatMap((e) => e.names).filter((n) => isFollowed(t.tour, n)))];
}

// Where a followed player is entered, by start date.
function whereIs(f) {
  const out = [];
  for (const { t, p } of knownLists().values())
    for (const [event, es] of [["Singles", p.singles], ["Doubles", p.doubles]])
      for (const e of es) if (e.names.some((n) => followMatch(f, t.tour, n))) out.push({ t, event, e });
  return out.sort((a, b) => a.t.startDate.localeCompare(b.t.startDate) || b.event.localeCompare(a.event)); // singles first
}

function toggleFollow(tour, name) {
  const i = state.follow.findIndex((f) => followMatch(f, tour, name));
  if (i >= 0) state.follow.splice(i, 1);
  else state.follow.push({ name, tour });
  saved.set("followedPlayers", state.follow);
  if (state.trace.at && !tracing) checkFollowChanges();
  renderFollow();
  if (state.view !== "players") render();
  tracePlayers();
}

// Finished tournaments' lists, kept in this browser as { year, lists: { key: [singles, doubles] } } with each
// entry as [names, countries, entry, seed].
const LISTS_KEY = "followLists";
const pack = (p) => [p.singles, p.doubles].map((es) => es.map((e) => [e.names, e.countries || [], e.entry || "", e.seed || ""]));
const unpack = (sd) => {
  const [singles, doubles] = sd.map((es) => es.map(([names, countries, entry, seed]) => ({ names, countries, entry, seed })));
  return { singles, doubles };
};

// Load every player list of this year, six at a time: from this browser for finished tournaments already
// kept, otherwise from the server. Runs while someone is followed or the Players tab is open, even in a
// background tab, so player alerts are found like the tournament ones.
async function tracePlayers(force = false) {
  if (tracing) return;
  if (!force && (Date.now() - state.trace.at < UPDATE_MIN * 60e3
    || (!state.follow.length && state.view !== "players"))) return;
  tracing = true;
  state.trace = { ...state.trace, done: 0, error: "" };
  renderFollow();
  try {
    const year = new Date().getFullYear(), now = localDay(new Date());
    const r = await fetch(`/api/tournaments?from=${year}-01-01&to=${year}-12-31`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const ts = (await r.json()).tournaments;
    const cache = saved.get(LISTS_KEY, {}), kept = cache.year === year ? cache.lists : {}, finished = {};
    const lists = state.trace.lists;
    state.trace.count = ts.length;
    const one = async (t) => {
      const k = key(t);
      if (kept[k]) {
        lists.set(k, { t, p: unpack(kept[k]) });
        finished[k] = kept[k];
      } else {
        const params = new URLSearchParams({ tour: t.tour, id: t.id, year: t.year, start: t.startDate, end: t.endDate });
        try {
          const res = await fetch(`/api/players?${params}`);
          const p = res.ok && await res.json();
          if (p) lists.set(k, { t, p });
          // An empty list may just not be published by the source yet: ask again next time.
          if (p && t.endDate < now && p.singles.length + p.doubles.length) finished[k] = pack(p);
        } catch {}
      }
      state.trace.done++;
    };
    for (let i = 0; i < ts.length; i += 6) {
      await Promise.all(ts.slice(i, i + 6).map(one));
      renderFollow();
    }
    for (const k of lists.keys()) if (!ts.some((t) => key(t) === k)) lists.delete(k); // deleted by hand since
    saved.set(LISTS_KEY, { year, lists: finished });
    state.trace.at = Date.now();
    checkFollowChanges();
  } catch (e) {
    state.trace.error = e.message;
  } finally {
    tracing = false;
  }
  renderFollow();
  if (state.view !== "players" && state.tournaments.length) render(); // ★ on the cards; skipped while the calendar is still loading
}

// ---------------------------------------------------------------- Player alerts
// After each scan of the year's lists, each followed player's entries in tournaments not yet finished are compared
// with those noted at the scan before, and every change is recorded as a player alert: entered a tournament,
// withdrew (no longer on a list that's still published), or moved between draws (qualifying to main draw).
// Separate from the tournament alerts; kept in this browser only. A newly followed player's entries are just noted.
const FOLLOW_SNAP = "followSnap", FOLLOW_ALERTS = "followAlerts";
state.followAlerts = saved.get(FOLLOW_ALERTS, []);
state.followAlertsOpen = false;
const fid = (f) => `${f.tour}|${norm(f.name)}`;

function checkFollowChanges() {
  const now = localDay(new Date()), snaps = saved.get(FOLLOW_SNAP, {}), found = [];
  for (const f of state.follow) {
    const cur = {}, prev = snaps[fid(f)], out = { ...(prev?.out || {}) };
    for (const x of whereIs(f)) if (x.t.endDate >= now)
      cur[`${key(x.t)}|${x.event}`] = { key: key(x.t), name: x.t.name, level: levelLabel(x.t), start: x.t.startDate, end: x.t.endDate,
        event: x.event, entry: x.e.entry || "", seed: x.e.seed || "" };
    const add = (kind, e, extra) => found.push({ kind, player: f.name, tour: f.tour, ...e, ...extra, at: Date.now(), unread: true });
    if (prev) {
      for (const [k, e] of Object.entries(cur)) {
        if (!prev.entries[k]) add("in", e);
        else if (prev.entries[k].entry !== e.entry) add("mv", e, { from: prev.entries[k].entry, to: e.entry });
        delete out[k];
      }
      for (const [k, e] of Object.entries(prev.entries)) {
        if (cur[k] || e.end < now) continue;
        // A list that's gone (or gone empty) says nothing about the player: keep the entry until it's back.
        const p = state.trace.lists.get(e.key)?.p;
        if (!p || !(p.singles.length + p.doubles.length)) { cur[k] = e; continue; }
        add("out", e);
        out[k] = e;
      }
    }
    for (const k in out) if (out[k].end < now) delete out[k];
    snaps[fid(f)] = { entries: cur, out };
  }
  for (const id in snaps) if (!state.follow.some((f) => fid(f) === id)) delete snaps[id]; // unfollowed
  saved.set(FOLLOW_SNAP, snaps);
  if (!found.length) return;
  state.followAlerts = [...found, ...saved.get(FOLLOW_ALERTS, [])].slice(0, MAX_ALERTS);
  saved.set(FOLLOW_ALERTS, state.followAlerts);
  const text = found.length <= 2 ? found.map(followAlertLine).join("; ")
    : `${found.length} changes for ${[...new Set(found.map((a) => a.player))].join(", ")}`;
  toast(`★ ${text}`, () => openFollowAlerts(true), "Show");
  if ("Notification" in window && Notification.permission === "granted") {
    try { new Notification("Player alerts", { body: text }); } catch {}
  }
  renderFollowAlerts();
}

const FOLLOW_KIND = { in: "Entered", out: "Withdrew from", mv: "Moved draws at" };
const followAlertLine = (a) => `${a.player} ${FOLLOW_KIND[a.kind].toLowerCase()} ${a.name}`;

function renderFollowAlerts() {
  const btn = $("#followAlertsBtn"); if (!btn) return;
  const unread = state.followAlerts.filter((a) => a.unread).length;
  btn.innerHTML = `🔔 Player alerts${unread ? `<span class="badge">${unread}</span>` : ""}`;
  btn.setAttribute("aria-label", `Player alerts, ${unread} new`);
  btn.setAttribute("aria-expanded", state.followAlertsOpen);
  const panel = $("#followAlertsPanel");
  panel.hidden = !state.followAlertsOpen;
  if (!state.followAlertsOpen) return;
  const day = (d) => fmt(d, { month: "short", day: "numeric" });
  const when = (ms) => new Date(ms).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  const entry = (c) => ENTRY[c] || c || "–";
  const canAsk = "Notification" in window && Notification.permission === "default";
  panel.innerHTML = `<div class="alerts-head"><h2>Player alerts</h2>
      ${canAsk ? '<button class="restore-btn" data-palerts="notify">Turn on desktop notifications</button>' : ""}
      ${unread ? '<button class="restore-btn" data-palerts="read">Mark all read</button>' : ""}
      ${state.followAlerts.length ? '<button class="restore-btn" data-palerts="clear">Clear all</button>' : ""}
      <button class="restore-btn" data-palerts="close" aria-label="Close player alerts">Close ✕</button></div>
    <p class="note">Checked every hour while this site is open: followed players entering a tournament, withdrawing, or moving
      between draws. Separate from the tournament alerts.</p>`
    + (state.followAlerts.length
      ? `<ul>${state.followAlerts.map((a, i) => `<li class="alert ${a.unread ? "unread" : "read"}"><span>
          <span class="alert-title"><strong>★ ${esc(a.player)}</strong><span class="pa-kind ${a.kind}">${FOLLOW_KIND[a.kind]}</span><strong>${esc(a.name)}</strong></span>
          <span class="note">${esc([a.level, `${day(a.start)} – ${day(a.end)}`, a.event,
            a.kind === "mv" ? `${entry(a.from)} → ${entry(a.to)}` : a.entry && entry(a.entry), a.seed && `seed ${a.seed}`].filter(Boolean).join(" · "))}
            · found ${when(a.at)}</span></span>
          <span class="alert-actions">
            <button class="state${a.unread ? " new" : ""}" data-pread="${i}" aria-pressed="${!a.unread}" title="${a.unread ? "Mark as read" : "Mark as unread"}">${a.unread ? "New" : "Read"}</button>
            <button class="restore-btn" data-pgo="${i}">Open</button>
            <button class="fold-link" data-pdismiss="${i}" aria-label="Dismiss alert: ${esc(followAlertLine(a))}">Dismiss ✕</button>
          </span></li>`).join("")}</ul>`
      : `<p class="note">No changes yet. When you follow someone, their entries are noted; changes show here from the next check on.</p>`);
}

// Show the player alerts, on the Players tab.
function openFollowAlerts(open) {
  state.followAlertsOpen = open;
  if (open && state.view !== "players") { setView("players"); render(); }
  renderFollowAlerts();
  if (open) $("#followAlertsPanel")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function setFollowRead(indexes, read) {
  for (const i of indexes) if (state.followAlerts[i]) state.followAlerts[i] = { ...state.followAlerts[i], unread: !read };
  saved.set(FOLLOW_ALERTS, state.followAlerts);
  renderFollowAlerts();
}

// Dropdown of every player in this year's lists, filtered by what's typed: picking one follows or unfollows them.
let directory = [], directoryOf = "", pickActive = 0, pickShown = [];
function playerDirectory() {
  const version = `${state.trace.at}|${state.trace.lists.size}`;
  if (version === directoryOf) return directory;
  const m = new Map();
  for (const { t, p } of state.trace.lists.values())
    for (const e of [...p.singles, ...p.doubles]) e.names.forEach((n, i) => {
      const id = `${t.tour}|${norm(n)}`;
      if (!m.has(id)) m.set(id, { name: n, key: norm(n), tour: t.tour, cc: "", ts: new Set() });
      const d = m.get(id);
      d.cc ||= (e.countries || [])[i] || "";
      d.ts.add(key(t));
    });
  directory = [...m.values()].sort((a, b) => a.name.localeCompare(b.name));
  directoryOf = version;
  return directory;
}

function renderPick() {
  const list = $("#pickList"), q = norm($("#pickInput").value);
  // Names with a word starting with what's typed come first.
  const starts = (d) => d.key.split(/[\s-]+/).some((w) => w.startsWith(q)) || d.key.startsWith(q);
  const hits = !q ? playerDirectory() : playerDirectory().filter((d) => d.key.includes(q)).sort((a, b) => starts(b) - starts(a));
  pickShown = hits.slice(0, 100);
  pickActive = Math.max(0, Math.min(pickActive, pickShown.length - 1));
  list.innerHTML = pickShown.map((d, i) => {
    const on = isFollowed(d.tour, d.name);
    return `<div class="pick-opt${i === pickActive ? " active" : ""}" role="option" id="pick-${i}" data-pick="${i}" aria-selected="${on}">
      <span class="star${on ? " on" : ""}" aria-hidden="true">${on ? "★" : "☆"}</span><span class="pick-name">${esc(d.name)}</span>
      <span class="cc">${esc(d.cc)}</span><span class="note">${d.ts.size} tournament${d.ts.size === 1 ? "" : "s"}</span><span class="tour-tag ${d.tour}">${d.tour}</span></div>`;
  }).join("")
    + (hits.length > pickShown.length ? `<div class="pick-more note">${hits.length - pickShown.length} more players: keep typing</div>` : "")
    + (!hits.length ? `<div class="pick-more note">${tracing ? "Still loading this year's players…" : "No player found."}</div>` : "");
  $("#pickInput").setAttribute("aria-activedescendant", pickShown.length ? `pick-${pickActive}` : "");
}
function openPick(open) {
  $("#pickList").hidden = !open;
  $("#pickInput").setAttribute("aria-expanded", open);
  if (open) renderPick();
}

// The Players tab's count, and the tracker itself when that tab is shown.
function renderFollow() {
  $('#mainTabs [data-page="players"]').innerHTML = `★ Players${state.follow.length ? `<span class="n">${state.follow.length}</span>` : ""}`;
  if (state.view === "players") renderTracker();
}

// How a followed player did in a completed tournament, from its finals: { how: "won" | "final" | "", event }.
function finish(f, stop) {
  const r = state.results[resultKey(stop.t)] || {};
  const reached = (side) => stop.events.find((x) => r[x.event.toLowerCase()]?.full[side].some((n) => followMatch(f, stop.t.tour, n)));
  const x = reached("winner") || reached("loser");
  return { how: !x ? "" : x === reached("winner") ? "won" : "final", event: x && stop.events.length > 1 ? `${x.event} ` : "" };
}

// Player tracker: each followed player's season as a chain of tournaments, left to right by date. Dots are
// joined by a solid line up to today and a dashed one after; a Today marker sits between played and to come.
function renderTracker() {
  const list = $("#list");
  // The heading and dropdown are drawn once, so typing in it isn't interrupted; the rest is redrawn.
  if (!$("#pickInput")) list.innerHTML = `<section class="tracker">
    <div class="tracker-bar"><div class="pick"><input id="pickInput" type="search" role="combobox" aria-expanded="false" aria-controls="pickList" aria-autocomplete="list"
      autocomplete="off" placeholder="Find a player to follow…" aria-label="Find a player to follow">
      <div class="pick-list" id="pickList" role="listbox" aria-label="Players" hidden></div></div>
      <button class="restore-btn" data-follow="check">↻ Check now</button>
      <button class="hidden-btn alerts-btn" id="followAlertsBtn" aria-expanded="false" aria-controls="followAlertsPanel">🔔 Player alerts</button></div>
    <div class="hidden-panel" id="followAlertsPanel" hidden></div>
    <p class="note" id="followStatus"></p><div id="followList"></div></section>`;
  const now = localDay(new Date()), year = new Date().getFullYear();
  const day = (d) => fmt(d, { month: "short", day: "numeric" });
  const time = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  $("#followStatus").innerHTML = `Pick players from the list, or use the ☆ next to a name in any player list. Their ${year} tournaments
    show as a chain. Faded stops after Today are <b>not confirmed</b>: tournaments at levels they've played this year whose
    entry list isn't out yet (WTA publishes them a few weeks ahead, ATP only at the draw). `
    + (tracing ? `Loading this year's player lists… ${state.trace.done}${state.trace.count ? ` / ${state.trace.count}` : ""}`
      : state.trace.error ? `Check failed: ${esc(state.trace.error)}`
      : state.trace.at ? `Last check ${time(state.trace.at)} (${state.trace.count} tournaments).` : "");

  const stopHTML = (f, s) => {
    const t = s.t, st = t.endDate < now ? "done" : t.startDate <= now ? "live" : "next", { how: res, event } = st === "done" ? finish(f, s) : {};
    if (s.out) return `<li class="stop st-next out"><span class="dot" aria-hidden="true">✕</span>
      <button class="stop-btn" data-open="${esc(key(t))}" data-start="${t.startDate}" title="Open ${esc(t.name)}">
        ${tileHTML(t)}<span class="stop-name">${esc(t.name)}</span>
        <span class="note">${day(t.startDate)} – ${day(t.endDate)}</span><span class="stop-ev">${esc(s.out.map((e) => e.event).join(" & "))}</span>
        <span class="stop-st">Withdrawn</span></button></li>`;
    if (s.maybe) return `<li class="stop st-next maybe"><span class="dot" aria-hidden="true"></span>
      <button class="stop-btn" data-open="${esc(key(t))}" data-start="${t.startDate}" title="Open ${esc(t.name)}: entry list not out yet">
        ${tileHTML(t)}<span class="stop-name">${esc(t.name)}</span>
        <span class="note">${day(t.startDate)} – ${day(t.endDate)}</span><span class="stop-ev">Entry list not out yet</span>
        <span class="stop-st">Not confirmed</span></button></li>`;
    const lines = s.events.map((x) => {
      const partner = x.e.names.filter((n) => !followMatch(f, t.tour, n));
      return `<span class="stop-ev">${[x.event, ENTRY[x.e.entry] || x.e.entry, x.e.seed && `seed ${x.e.seed}`].filter(Boolean).map(esc).join(" · ")}`
        + `${partner.length ? `<br>with ${esc(partner.join(" / "))}` : ""}</span>`;
    }).join("");
    // With singles and doubles entries, the label says which event's final it was.
    const label = res === "won" ? `🏆 ${event}${event ? "champion" : "Champion"}` : res === "final" ? `${event}${event ? "final" : "Final"}`
      : st === "done" ? "Played" : st === "live" ? "Playing now" : "Upcoming";
    return `<li class="stop st-${st}${res ? ` ${res}` : ""}"><span class="dot" aria-hidden="true"></span>
      <button class="stop-btn" data-open="${esc(key(t))}" data-start="${t.startDate}" title="Open ${esc(t.name)}">
        ${tileHTML(t)}<span class="stop-name">${esc(t.name)}</span>
        <span class="note">${day(t.startDate)} – ${day(t.endDate)}</span>${lines}
        <span class="stop-st">${label}</span></button></li>`;
  };

  // A chain scrolled by hand stays where it was across redraws; the others are kept at today.
  const scrolled = new Map([...list.querySelectorAll(".chain[data-moved]")].map((c) => [c.dataset.player, c.scrollLeft]));
  const done = [], snaps = saved.get(FOLLOW_SNAP, {});
  $("#followList").innerHTML = !state.follow.length
    ? `<div class="track empty"><p>Not following anyone yet. Find a player above to see their season as a chain of tournaments.</p></div>`
    : state.follow.map((f, i) => {
      // One stop per tournament, with its singles and doubles entries.
      const stops = new Map();
      for (const x of whereIs(f)) {
        if (!stops.has(key(x.t))) stops.set(key(x.t), { t: x.t, events: [] });
        stops.get(key(x.t)).events.push(x);
      }
      const all = [...stops.values()], past = all.filter((s) => s.t.endDate < now), ahead = all.filter((s) => s.t.endDate >= now);
      done.push(...past.map((s) => s.t));
      const titles = past.filter((s) => finish(f, s).how === "won").length, next = ahead[0];
      // Not confirmed: tournaments still to start on their tour, at a level they've played this year, whose entry list
      // isn't out yet, in a week they're not already entered elsewhere. The year-end Finals only for those seeded in the
      // top 8 at a Grand Slam or 1000 this year; the Next Gen Finals (under 20s) never.
      const levels = new Set(past.map((s) => tier(s.t)));
      if (past.some((s) => ["gs", "1000"].includes(tier(s.t)) && s.events.some((x) => x.event === "Singles" && +x.e.seed && +x.e.seed <= 8))) levels.add("finals");
      const busy = (t) => ahead.some((s) => s.t.startDate <= t.endDate && s.t.endDate >= t.startDate);
      const maybe = !past.length ? [] : [...state.trace.lists.values()]
        .filter(({ t, p }) => (!f.tour || t.tour === f.tour) && t.startDate > now && !p.singles.length && !p.doubles.length
          && tier(t) && levels.has(tier(t)) && !/next gen/i.test(t.level || "") && !busy(t))
        .map(({ t }) => ({ t, events: [], maybe: true }));
      // Withdrawn: on an earlier check's list, but not any more (see the player alerts).
      const outs = new Map();
      for (const e of Object.values(snaps[fid(f)]?.out || {})) {
        const t = state.trace.lists.get(e.key)?.t;
        if (!t || e.end < now || stops.has(e.key)) continue;
        if (!outs.has(e.key)) outs.set(e.key, { t, out: [] });
        outs.get(e.key).out.push(e);
      }
      const coming = [...ahead, ...outs.values(), ...maybe].sort((a, b) => a.t.startDate.localeCompare(b.t.startDate));
      const who = playerDirectory().find((d) => followMatch(f, d.tour, d.name));
      const id = fid(f);
      return `<article class="track">
        <div class="track-head">
          <div><h3><span class="fav-star">★</span> ${esc(f.name)}</h3>
            <span class="note">${esc([f.tour || "ATP or WTA", who && who.cc].filter(Boolean).join(" · "))}${next ? next.t.startDate <= now ? ` · playing now: ${esc(next.t.name)}` : ` · next: ${esc(next.t.name)}, ${day(next.t.startDate)}` : ""}</span></div>
          <div class="track-stats"><span><b>${past.length}</b>played</span><span><b>${titles}</b>title${titles === 1 ? "" : "s"}</span><span><b>${ahead.length}</b>to come</span>${outs.size ? `<span><b>${outs.size}</b>withdrawn</span>` : ""}${maybe.length ? `<span><b>${maybe.length}</b>not confirmed</span>` : ""}</div>
          <button class="restore-btn" data-unfollow="${i}" aria-label="Unfollow ${esc(f.name)}">Unfollow</button>
        </div>
        ${coming.length || past.length ? `<ol class="chain" data-player="${esc(id)}" aria-label="${esc(f.name)}'s ${year} tournaments">
          ${past.map((s) => stopHTML(f, s)).join("")}<li class="today"><span>Today</span></li>${coming.map((s) => stopHTML(f, s)).join("")}</ol>`
          : `<p class="note">${tracing || !state.trace.at ? "Looking…" : `Not in any player list of ${year}.`}</p>`}
      </article>`;
    }).join("");
  for (const c of list.querySelectorAll(".chain")) {
    if (scrolled.has(c.dataset.player)) { c.scrollLeft = scrolled.get(c.dataset.player); c.dataset.moved = ""; }
    else { c.scrollLeft = c.querySelector(".today").offsetLeft - c.clientWidth * 0.6; c.dataset.auto = c.scrollLeft; }
  }
  if (!$("#pickList").hidden) renderPick();
  renderFollowAlerts();
  loadResults(done); // finals, for the 🏆 on tournaments they won
}

// A chain scrolled away from where it was put counts as scrolled by hand.
$("#list").addEventListener("scroll", (e) => {
  const c = e.target;
  if (c.classList?.contains("chain") && Math.abs(c.scrollLeft - +c.dataset.auto) > 1) c.dataset.moved = "";
}, true);
// The tracker's buttons and dropdown. The dropdown stays open after a pick, so several players can be followed in a row.
$("#list").addEventListener("click", async (e) => {
  if (e.target.id === "pickInput") return openPick(true);
  const pa = e.target.closest("#followAlertsBtn, [data-palerts], [data-pread], [data-pgo], [data-pdismiss]");
  if (pa) {
    if (pa.id === "followAlertsBtn") return openFollowAlerts(!state.followAlertsOpen);
    if (pa.dataset.palerts === "close") { openFollowAlerts(false); return $("#followAlertsBtn").focus(); }
    if (pa.dataset.pread) return setFollowRead([+pa.dataset.pread], state.followAlerts[+pa.dataset.pread].unread);
    if (pa.dataset.palerts === "read") return setFollowRead(state.followAlerts.map((_, i) => i), true);
    if (pa.dataset.pgo) {
      const a = state.followAlerts[+pa.dataset.pgo];
      setFollowRead([+pa.dataset.pgo], true);
      return goToTournament({ key: a.key, start: a.start }, false);
    }
    if (pa.dataset.pdismiss) state.followAlerts.splice(+pa.dataset.pdismiss, 1);
    if (pa.dataset.palerts === "clear") state.followAlerts = [];
    if (pa.dataset.palerts === "notify") await Notification.requestPermission();
    saved.set(FOLLOW_ALERTS, state.followAlerts);
    return renderFollowAlerts();
  }
  const b = e.target.closest("[data-follow], [data-unfollow], .stop-btn"); if (!b) return;
  if (b.dataset.follow === "check") return tracePlayers(true);
  if (b.dataset.unfollow) { const f = state.follow[+b.dataset.unfollow]; return toggleFollow(f.tour, f.name); }
  if (b.dataset.open) goToTournament({ key: b.dataset.open, start: b.dataset.start }, false);
});
$("#list").addEventListener("mousedown", (e) => {
  const o = e.target.closest("[data-pick]"); if (!o) return;
  e.preventDefault(); // keep the focus in the search box
  pickActive = +o.dataset.pick;
  const d = pickShown[pickActive];
  toggleFollow(d.tour, d.name);
});
$("#list").addEventListener("focusin", (e) => { if (e.target.id === "pickInput") openPick(true); });
$("#list").addEventListener("focusout", (e) => { if (e.target.id === "pickInput") openPick(false); });
$("#list").addEventListener("input", (e) => { if (e.target.id === "pickInput") { pickActive = 0; openPick(true); } });
$("#list").addEventListener("keydown", (e) => {
  if (e.target.id !== "pickInput") return;
  if (e.key === "Escape") return openPick(false);
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    if ($("#pickList").hidden) return openPick(true);
    pickActive = Math.max(0, Math.min(pickShown.length - 1, pickActive + (e.key === "ArrowDown" ? 1 : -1)));
    renderPick();
    $(`#pick-${pickActive}`)?.scrollIntoView({ block: "nearest" });
  }
  if (e.key === "Enter" && !$("#pickList").hidden && pickShown[pickActive]) {
    e.preventDefault();
    toggleFollow(pickShown[pickActive].tour, pickShown[pickActive].name);
  }
});

// ---------------------------------------------------------------- Champions of completed tournaments

// Each completed tournament shows its singles and doubles finals. A final never changes, so results are
// kept in this browser; one that isn't available yet is asked for again on the next visit.
const resultKey = (t) => `${t.tour}:${t.id}:${t.year}`;
// Saved as "results2": "results" could hold a mixed doubles final as an ATP event's doubles final.
try { localStorage.removeItem("results"); } catch {}
state.results = saved.get("results2", {});
const resultsTried = new Set(), resultsPending = new Set(), resultsQueue = [];
let resultsRunning = 0;

function champsHTML(t) {
  const k = resultKey(t), r = state.results[k];
  if (!r) return `<div class="champs">${resultsTried.has(k) && !resultsPending.has(k) ? '<span class="none">No final result available</span>' : ""}</div>`;
  const line = (label, f) => !f ? "" : `<div class="champ" title="${esc(`${f.full.winner.join(" / ")} d. ${f.full.loser.join(" / ")}`)}">
    <span class="ev">${label}</span>🏆 <b>${esc(f.winner.join(" / "))}</b> d. ${esc(f.loser.join(" / "))}<span class="sc">${esc([f.score, f.note].filter(Boolean).join(" "))}</span></div>`;
  return `<div class="champs">${line("Singles", r.singles)}${line("Doubles", r.doubles)}</div>`;
}

// Ask for the results of the completed tournaments shown (or of those given), four at a time.
function loadResults(ts = [...document.querySelectorAll("#list .card.st-done")].map((card) => state.tournaments.find((x) => key(x) === card.dataset.key))) {
  for (const t of ts) {
    const k = t && resultKey(t);
    if (!t || state.results[k] || resultsTried.has(k)) continue;
    resultsTried.add(k); resultsPending.add(k); resultsQueue.push(t);
  }
  while (resultsRunning < 4 && resultsQueue.length) fetchResult(resultsQueue.shift());
}

async function fetchResult(t) {
  resultsRunning++;
  try {
    const params = new URLSearchParams({ tour: t.tour, id: t.id, year: t.year, start: t.startDate, end: t.endDate });
    const r = await fetch(`/api/results?${params}`);
    const data = await r.json();
    if (r.ok && (data.singles || data.doubles)) {
      state.results[resultKey(t)] = data;
      saved.set("results2", state.results);
    }
  } catch (e) {
    console.warn("Couldn't load results", t.name, e);
  }
  resultsRunning--;
  resultsPending.delete(resultKey(t));
  // Update just this tournament's line: re-rendering a whole year's list for each result would stall the page.
  for (const el of document.querySelectorAll(`#list .card[data-key="${CSS.escape(key(t))}"] .champs`)) el.outerHTML = champsHTML(t);
  if (state.view === "players") renderTracker();
  loadResults();
}

loadHidden();
load();
renderAlerts();
renderFollow();
watchPlayers();
tracePlayers();
// Each runs its check only once it's an hour since the last one.
setInterval(() => { watchPlayers(); tracePlayers(); }, 5 * 60e3);
</script>
</body>
</html>
