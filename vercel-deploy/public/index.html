<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tennis Tournaments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:ital,wght@0,400;0,500;0,600;1,900&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea; --surface: #fffdf8; --ink: #1d2a24; --muted: #6b766f; --line: #e2ddd1;
    --court: #1f5c46; --clay: #c4622d; --atp: #1f4e8c; --wta: #7a2d8c; --ball: #2ee86f;
    --st-live: #1f9d63; --st-next: #2b6cc4; --st-done: #8a918d; --accent: var(--court);
    --t1000: #a8821a; --t500: #5d736e; --t125: #8a918d; --gold: #c99a1e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111714; --surface: #18201c; --ink: #e8ece9; --muted: #93a099; --line: #2a3530;
      --court: #5fb38f; --clay: #e08355; --atp: #7aa7e6; --wta: #c88ad6;
      --st-live: #4cd18f; --st-next: #6fa8f0; --st-done: #7d8781; --accent: var(--court);
      --t1000: #e2b93f; --t500: #9fb6b0; --t125: #8f9a94; --gold: #e2b93f; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
  header { background: var(--court); color: #fff; padding: 28px 16px 22px; position: relative; overflow: hidden; }
  header::after { content: ""; position: absolute; inset: auto -40px -60px auto; width: 180px; height: 180px; border-radius: 50%;
    background: var(--ball); opacity: .9; box-shadow: inset 18px -10px 0 -8px rgba(0,0,0,.08); }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font: 800 clamp(28px, 5vw, 42px)/1.05 Fraunces, Georgia, serif; margin: 0 0 6px; letter-spacing: -.5px; position: relative; z-index: 1; }
  header p { margin: 0; opacity: .85; position: relative; z-index: 1; }

  .controls { display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 12px;
    background: var(--bg); border-bottom: 1px solid var(--line); }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }

  /* Month selector: a scrolling strip of month tiles; archive months dimmed, divider before the current month */
  .months { display: flex; align-items: stretch; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding: 2px 2px 6px; }
  .months button { all: unset; box-sizing: border-box; cursor: pointer; position: relative; flex: none; width: 62px; height: 64px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    transition: border-color .15s, transform .15s; }
  .months button:hover { border-color: color-mix(in srgb, var(--ink) 35%, var(--line)); transform: translateY(-1px); }
  .months .mo { font: 600 21px/1 Oswald, "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .02em; }
  .months .yr { font: 600 10px Inter, sans-serif; color: var(--muted); }
  .months .n { position: absolute; top: 4px; right: 6px; font: 600 10px Inter, sans-serif; color: var(--muted); }
  .months .arch { background: transparent; }
  .months .arch .mo { color: var(--muted); }
  .months .now::before { content: ""; position: absolute; top: 6px; left: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--st-live); }
  .months button.empty { opacity: .4; }
  .months button[aria-pressed="true"] { border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
  .months button[aria-pressed="true"] .mo { color: var(--ink); }
  .months button:focus-visible { outline: 2px solid var(--court); outline-offset: 2px; }
  .months .sep { flex: none; width: 1px; margin: 6px 4px; background: var(--line); }
  .months .tag { flex: none; align-self: center; font: 700 10px Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); writing-mode: vertical-rl; transform: rotate(180deg); }

  /* Tour selector (second row): large logo-style tiles; filled with the tour color when selected */
  .tabs { display: flex; gap: 8px; }
  .tabs button { all: unset; box-sizing: border-box; cursor: pointer; position: relative; width: 132px; height: 72px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface);
    transition: border-color .15s, transform .15s; }
  .tabs button:hover { border-color: color-mix(in srgb, var(--tc) 60%, var(--line)); transform: translateY(-1px); }
  .tabs button[data-tour="ALL"] { --tc: var(--court); --g1: #2f8a63; --g2: #1a4f3b; }
  .tabs button[data-tour="ATP"] { --tc: var(--atp); --g1: #2d5f9e; --g2: #14325f; }
  .tabs button[data-tour="WTA"] { --tc: var(--wta); --g1: #8a4a9e; --g2: #4a1d57; }
  .tabs .mark { font: italic 900 26px/1 Inter, sans-serif; letter-spacing: -.05em; color: var(--tc); }
  .tabs .sub { font: 600 11px Inter, sans-serif; color: var(--muted); }
  .tabs .n { position: absolute; top: 6px; right: 9px; font: 600 11px Inter, sans-serif; color: var(--muted); }
  .tabs button[aria-pressed="true"] { border-color: transparent; background: linear-gradient(135deg, var(--g1), var(--g2));
    box-shadow: 0 4px 12px -4px var(--g2); }
  .tabs button[aria-pressed="true"] .mark { color: #fff; }
  .tabs button[aria-pressed="true"] :is(.sub, .n) { color: rgba(255,255,255,.8); }
  .tabs button:focus-visible { outline: 2px solid var(--court); outline-offset: 2px; }
  .chips button:focus-visible { outline: 2px solid var(--court); outline-offset: 2px; }
  /* Tournament-type selector: large icon tiles */
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .chips button { all: unset; box-sizing: border-box; cursor: pointer; position: relative; flex: none; width: 104px; height: 92px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
    transition: border-color .15s, background .15s, transform .15s; }
  .chips button:hover { border-color: color-mix(in srgb, var(--ink) 35%, var(--line)); transform: translateY(-1px); }
  .chips .ico { height: 38px; display: grid; place-items: center; }
  .chips .ico svg { width: 34px; height: 34px; }
  .chips .num { display: flex; flex-direction: column; align-items: center; line-height: 1; }
  .chips .num b { font: 600 32px/1 Oswald, "Arial Narrow", sans-serif; color: var(--tc); }
  .chips .lbl { font: 600 12px Inter, sans-serif; white-space: nowrap; }
  .chips .n { position: absolute; top: 6px; right: 8px; font: 600 11px Inter, sans-serif; color: var(--muted); }
  .chips button[aria-pressed="true"] { border: 2px solid var(--tab, var(--accent)); background: color-mix(in srgb, var(--tab, var(--accent)) 16%, var(--surface)); }
  .chips button.empty { opacity: .4; }
  .chips[data-tour="ATP"] { --tab: var(--atp); --t250: var(--atp); }
  .chips[data-tour="WTA"] { --tab: var(--wta); --t250: var(--wta); }
  .chips[data-tour="ALL"] { --t250: var(--court); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: none; padding: 8px 14px; font: 600 13px Inter, sans-serif; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  label { display: flex; flex-direction: column; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); gap: 4px; }
  input, select { font: 14px Inter, sans-serif; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  .year { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
  .year button { all: unset; cursor: pointer; padding: 6px 12px; font: 600 16px/1 Inter, sans-serif; color: var(--muted); }
  .year button:hover { color: var(--ink); }
  .year button:focus-visible { outline: 2px solid var(--court); outline-offset: -2px; border-radius: 999px; }
  .year span { font: 600 15px Oswald, "Arial Narrow", sans-serif; letter-spacing: .04em; min-width: 40px; text-align: center; }
  .grow { flex: 1 1 200px; }
  .grow input { width: 100%; }

  main { padding: 8px 16px 60px; }
  .status { color: var(--muted); padding: 24px 0; }
  .month { margin-top: 26px; }
  /* Month bar: full width, sticks just below the filter bar while its month is on screen */
  .month h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; padding: 10px 14px;
    position: sticky; top: calc(var(--controls-h, 70px) - 1px); z-index: 4;
    font: 700 15px Inter, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--ink);
    background: color-mix(in srgb, var(--accent) 14%, var(--surface)); border: 1px solid var(--line);
    border-left: 5px solid var(--accent); border-radius: 10px;
    /* first shadow is a solid backing so cards don't show around the rounded corners while stuck */
    box-shadow: 0 -10px 0 var(--bg), 0 4px 10px -6px rgba(0,0,0,.35); }
  .month h2 .arch { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; padding: 3px 8px; border-radius: 999px;
    color: var(--muted); border: 1px solid var(--line); }
  .month h2 .count { margin-left: auto; font-size: 11px; font-weight: 600; letter-spacing: .06em; padding: 3px 9px; border-radius: 999px;
    color: var(--ink); background: color-mix(in srgb, var(--ink) 10%, transparent); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .card > button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; }
  .card > button:focus-visible { outline: 2px solid var(--court); outline-offset: -2px; }

  /* Tournament tile: court-colored top with the city, light strip with level badge and start date */
  .tile { width: 136px; height: 88px; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
    border: 2px solid #4fc79a; box-shadow: 0 2px 6px rgba(0,0,0,.18); --c1: #2f6db5; --c2: #1b4a86;
    background:
      linear-gradient(90deg, transparent calc(50% - 1px), rgba(255,255,255,.35) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(transparent 11px, rgba(255,255,255,.3) 11px 13px, transparent 13px),
      radial-gradient(circle at 82% 18%, rgba(255,255,255,.28), transparent 45%),
      linear-gradient(135deg, var(--c1), var(--c2)); }
  .tile.hard { --c1: #3a7bc8; --c2: #1d4f8f; }
  .tile.clay { --c1: #d0703a; --c2: #9b4520; }
  .tile.grass { --c1: #5b9c45; --c2: #2f6a2a; }
  .tile.none.ATP { --c1: #2d5f9e; --c2: #14325f; }
  .tile.none.WTA { --c1: #8a4a9e; --c2: #4a1d57; }
  .tile-top { flex: 1; display: grid; place-items: center; padding: 4px 6px; text-align: center;
    background: rgba(255,255,255,.12); backdrop-filter: blur(1px);
    color: #fff; font: 600 19px/1 Oswald, "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .02em;
    text-shadow: 0 1px 3px rgba(0,0,0,.45); overflow-wrap: anywhere; }
  .tile-top.md { font-size: 15px; } .tile-top.sm { font-size: 12.5px; }
  .tile-bot { height: 26px; flex: none; background: #f7f5ef; display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 0 6px;
    font: 500 13px Oswald, "Arial Narrow", sans-serif; color: #1d2a24; }
  .lvl { display: inline-flex; align-items: baseline; gap: 2px; font: italic 900 13px/1 Inter, sans-serif; letter-spacing: -.04em; white-space: nowrap; }
  .lvl.mark.WTA { color: #3b1a6e; } .lvl.mark.ATP { color: #10316b; }
  .lvl.pill { color: #fff; border-radius: 3px; padding: 3px 4px 2px; }
  .lvl.pill small { font-size: 11px; letter-spacing: -.02em; }
  .lvl.t1000 { background: #b8901f; } .lvl.t500 { background: #6f8580; }
  .lvl.t250.WTA { background: #8a5cc2; } .lvl.t250.ATP { background: #3a6fb8; }
  .lvl.t125 { background: none; color: #6f8580; box-shadow: inset 0 0 0 1.5px #9aa9a5; }
  .tile-date { white-space: nowrap; }
  .card.past .tile { filter: saturate(.5); opacity: .8; }
  .name { font: 600 17px/1.25 Fraunces, Georgia, serif; }
  .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 2px; }
  .dates { text-align: right; font-size: 13px; font-weight: 600; white-space: nowrap; }
  /* Status: colored pill plus a stripe on the card's left edge */
  .status-pill { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600; color: var(--st); background: color-mix(in srgb, var(--st) 15%, transparent); }
  .status-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .st-live { --st: var(--st-live); } .st-next { --st: var(--st-next); } .st-done { --st: var(--st-done); }
  .st-live .status-pill::before { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .st-live .status-pill::before { animation: none; } }
  .card { border-left: 4px solid var(--st, var(--line)); }
  .chev { transition: transform .2s; display: inline-block; margin-left: 6px; color: var(--muted); }
  .card.open .chev { transform: rotate(90deg); }

  .detail { border-top: 1px solid var(--line); padding: 14px 16px 18px; display: none; }
  .card.open .detail { display: block; }
  .detail-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 10px; }
  .detail a { color: var(--court); font-weight: 600; text-decoration: none; }
  .detail a:hover { text-decoration: underline; }
  .note { color: var(--muted); font-size: 13px; }
  .group-title { font: 600 12px Inter, sans-serif; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
  .players { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 16px; }
  .players li { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  /* Player photos (local site only): a round photo per player, or their initials while there's none */
  .players.with-photos { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .players.with-photos li { align-items: center; gap: 12px; padding: 6px 0; }
  .faces { display: inline-flex; flex: none; }
  .faces > * { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--surface); box-sizing: border-box; flex: none; }
  .faces > * + * { margin-left: -20px; }
  .faces > a { display: block; overflow: hidden; }
  .faces > a img { width: 100%; height: 100%; border: 0; border-radius: 50%; display: block; }
  .faces img { object-fit: cover; object-position: 50% 12%; background: var(--line); }
  .faces .ini { display: grid; place-items: center; background: color-mix(in srgb, var(--court) 18%, var(--surface)); color: var(--muted);
    font: 700 18px Inter, sans-serif; }
  .players .cc { font-size: 11px; font-weight: 600; color: var(--muted); min-width: 32px; }
  .players .seed { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--clay); }
  /* Local editing: delete button, hidden list, undo toast (only shown when the local server allows editing) */
  /* Player list updates: Update button, last-updated time, changes since the list was first loaded */
  .upd { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .upd-btn { all: unset; cursor: pointer; font: 600 12px Inter, sans-serif; padding: 5px 11px; border-radius: 999px;
    border: 1px solid var(--court); color: var(--court); background: var(--surface); white-space: nowrap; }
  .upd-btn:hover { background: color-mix(in srgb, var(--court) 10%, var(--surface)); }
  .upd-btn[disabled] { opacity: .6; cursor: progress; }
  .upd-btn:focus-visible { outline: 2px solid var(--court); outline-offset: 2px; }
  .changes { border: 1px solid var(--line); border-left: 4px solid var(--court); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px;
    font-size: 13px; background: color-mix(in srgb, var(--court) 6%, var(--surface)); }
  .changes p { margin: 2px 0; }
  .changes b { font-weight: 700; }
  .changes .out { color: #d9534f; }
  .changes .in { color: var(--court); }
  .players .new { font: 700 10px Inter, sans-serif; text-transform: uppercase; letter-spacing: .04em; color: #fff; background: var(--court);
    border-radius: 4px; padding: 1px 5px; }
  .del-btn, .hidden-btn, .restore-btn, .toast button { all: unset; cursor: pointer; font: 600 12px Inter, sans-serif;
    padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap; }
  .del-btn { color: #d9534f; border-color: color-mix(in srgb, #d9534f 45%, var(--line)); }
  .del-btn.armed { background: #d9534f; border-color: #d9534f; color: #fff; }
  .hidden-btn { align-self: end; padding: 8px 14px; }
  :is(.del-btn, .hidden-btn, .restore-btn, .toast button):focus-visible { outline: 2px solid var(--court); outline-offset: 2px; }
  .hidden-panel { padding: 14px 16px 0; }
  .hidden-panel h2 { font: 700 13px Inter, sans-serif; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 8px; }
  .hidden-panel ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .hidden-panel li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .hidden-panel li:first-child { border-top: 0; }
  .hidden-panel li > span { flex: 1; min-width: 0; }
  .hidden-panel .note { display: block; }
  /* In-app player alerts: bell button with unread count, and the alerts panel */
  .alerts-btn { position: relative; }
  .alerts-btn .badge { display: inline-block; min-width: 18px; margin-left: 6px; padding: 1px 5px; border-radius: 999px; background: #d9534f; color: #fff;
    font: 700 11px Inter, sans-serif; text-align: center; box-sizing: border-box; }
  .alerts-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 8px; }
  .alerts-head h2 { margin: 0 auto 0 0; }
  .hidden-panel li.alert { align-items: flex-start; }
  .alert.unread { box-shadow: inset 4px 0 0 var(--court); background: color-mix(in srgb, var(--court) 7%, var(--surface)); }
  .alert.read > span { opacity: .62; }
  .alert-title { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  /* Folding: the alert's title is a button; a folded alert shows a one-line count of its changes */
  .fold { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .fold:focus-visible { outline: 2px solid var(--court); outline-offset: 2px; border-radius: 4px; }
  .fold .chev { display: inline-block; width: 12px; font-size: 16px; line-height: 1; color: var(--muted); transition: transform .15s; }
  .fold[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .sum { margin-top: 5px; font: 600 12px Inter, sans-serif; }
  .sum .out { color: #e5655f; } .sum .in { color: var(--court); } .sum .mv { color: #e0a43a; }
  .alert-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
  /* Read / unread label: a small switch on each alert */
  .state { all: unset; cursor: pointer; font: 700 10px Inter, sans-serif; text-transform: uppercase; letter-spacing: .06em;
    padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .state.new { background: var(--court); border-color: var(--court); color: #fff; }
  .state:focus-visible { outline: 2px solid var(--court); outline-offset: 2px; }
  /* The differences: one chip per player, colored by the kind of change */
  .diff { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 7px; }
  .diff .kind { font: 700 11px Inter, sans-serif; text-transform: uppercase; letter-spacing: .05em; margin-right: 2px; min-width: 76px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 13px; line-height: 1.5;
    border: 1px solid; white-space: nowrap; }
  .chip b { font-weight: 800; }
  .diff.out .kind { color: #e5655f; }
  .diff.out .chip { color: #e5655f; border-color: color-mix(in srgb, #e5655f 45%, transparent); background: color-mix(in srgb, #e5655f 12%, transparent); }
  .diff.out .chip span { text-decoration: line-through; text-decoration-thickness: 1.5px; }
  .diff.in .kind { color: var(--court); }
  .diff.in .chip { color: var(--court); border-color: color-mix(in srgb, var(--court) 45%, transparent); background: color-mix(in srgb, var(--court) 12%, transparent); }
  .diff.mv .kind { color: #e0a43a; }
  .diff.mv .chip { color: #e0a43a; border-color: color-mix(in srgb, #e0a43a 45%, transparent); background: color-mix(in srgb, #e0a43a 12%, transparent); }
  .diff.mv .chip i { font-style: normal; opacity: .85; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 20; display: flex; align-items: center; gap: 14px;
    padding: 10px 12px 10px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); font: 500 14px Inter, sans-serif;
    box-shadow: 0 8px 24px rgba(0,0,0,.3); max-width: calc(100vw - 32px); }
  .toast button { background: transparent; color: inherit; border-color: color-mix(in srgb, var(--bg) 40%, transparent); }
  mark { background: var(--ball); color: #1d2a24; border-radius: 3px; padding: 0 2px; }

  .legend { display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 18px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .cal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
  .cal-head, .cal-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal-head span { font: 600 11px Inter, sans-serif; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 8px 6px; }
  .cal-week { border-top: 1px solid var(--line); min-height: 70px; padding-bottom: 6px; align-content: start;
    background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: calc(100% / 7) 100%; background-position: -1px 0; }
  .cal-day { grid-row: 1; font-size: 12px; font-weight: 600; padding: 5px 8px 3px; }
  .cal-day.out { color: var(--muted); opacity: .45; }
  .cal-day.today span { background: var(--clay); color: #fff; border-radius: 999px; padding: 1px 7px; }
  .cal-ev { all: unset; box-sizing: border-box; margin: 1px 3px; padding: 2px 7px; border-radius: 6px; cursor: pointer; color: #fff;
    font: 600 12px/1.35 Inter, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .cal-ev.ATP { background: var(--atp); } .cal-ev.WTA { background: var(--wta); }
  .cal-ev.past { opacity: .5; }
  .cal-ev.cl { margin-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .cal-ev.cr { margin-right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .cal-ev.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ball); }
  .cal-ev:focus-visible { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--court); }
  .cal-ev small { font-weight: 800; opacity: .8; margin-right: 5px; }

  @media (max-width: 560px) {
    .chips button { width: 88px; height: 80px; gap: 4px; }
    .tabs button { flex: 1; width: auto; height: 64px; }
    .tabs .mark { font-size: 22px; }
    .chips .num b { font-size: 27px; }
    .card > button { grid-template-columns: auto 1fr; gap: 12px; }
    .tile { width: 112px; height: 76px; }
    .tile-top { font-size: 16px; } .tile-top.md { font-size: 13px; } .tile-top.sm { font-size: 11px; }
    .dates { grid-column: 2; text-align: left; }
    .cal-head span { padding: 6px 4px; font-size: 10px; }
    .cal-day { padding: 4px 4px 2px; font-size: 11px; }
    .cal-ev { font-size: 10px; padding: 1px 4px; margin: 1px; }
    .cal-ev small { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Tennis Tournaments</h1>
    <p>ATP &amp; WTA calendar: dates, venues and player lists in one place.</p>
  </div>
</header>

<div class="controls wrap">
  <div class="row">
    <div class="seg" id="viewSeg" role="group" aria-label="View">
      <button data-view="list" aria-pressed="true">List</button>
      <button data-view="calendar" aria-pressed="false">Calendar</button>
    </div>
    <div class="year" id="yearNav" role="group" aria-label="Year">
      <button data-step="-1" aria-label="Previous year">‹</button><span id="yearLabel"></span><button data-step="1" aria-label="Next year">›</button>
    </div>
    <label class="grow">Search <input type="search" id="q" placeholder="Tournament, city, country or loaded player…"></label>
    <button id="alertsBtn" class="hidden-btn alerts-btn" aria-expanded="false" aria-controls="alertsPanel">🔔 Alerts</button>
    <button id="hiddenBtn" class="hidden-btn" aria-expanded="false" hidden>Hidden (0)</button>
  </div>
  <div class="months" id="monthStrip" role="group" aria-label="Month"></div>
  <div class="tabs" id="tourSeg" role="group" aria-label="Tour">
    <button data-tour="ALL" aria-pressed="true"><span class="n"></span><span class="mark">ALL</span><span class="sub">Both tours</span></button>
    <button data-tour="ATP" aria-pressed="false"><span class="n"></span><span class="mark">ATP</span><span class="sub">Men's tour</span></button>
    <button data-tour="WTA" aria-pressed="false"><span class="n"></span><span class="mark">WTA</span><span class="sub">Women's tour</span></button>
  </div>
  <div class="chips" id="typeChips" role="group" aria-label="Tournament type"></div>
</div>

<section class="wrap hidden-panel" id="alertsPanel" hidden></section>
<section class="wrap hidden-panel" id="hiddenPanel" hidden></section>
<main class="wrap" id="list"><div class="status">Loading tournaments…</div></main>

<script>
const $ = (s) => document.querySelector(s);
const state = { tour: "ALL", type: "", month: "", months: [], view: "list", editable: false, hidden: [], tournaments: [], players: new Map(), loading: new Set(), open: new Set(), selected: null, photos: {}, photosOn: null };
// Earlier versions remembered per-tournament Auto-update switches here; the switch is gone.
try { localStorage.removeItem("autoUpdate"); } catch {}
const today = new Date();
const localDay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const thisMonth = localDay(today).slice(0, 7);
// The site shows one year at a time (January–December), opening on this year and month; "" month means all months.
state.year = today.getFullYear();
state.month = thisMonth;
let scrolledToMonth = false;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (d, opts) => new Date(d + "T12:00:00").toLocaleDateString(undefined, opts);
const key = (t) => `${t.tour}:${t.id}`;
const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

// List-view tile: city (or event name for Grand Slams/Finals), surface-colored background, level badge and start date.
function tileHTML(t) {
  const finals = /finals/i.test(t.level || "");
  const title = finals ? (/next gen/i.test(t.level) ? "Next Gen Finals" : `${t.tour} Finals`)
    : t.level === "Grand Slam" || !t.city ? t.name : t.city;
  const size = title.length > 20 ? "sm" : title.length > 11 ? "md" : "";
  const sf = (t.surface || "").toLowerCase();
  const surface = sf.includes("clay") ? "clay" : sf.includes("grass") ? "grass" : sf.includes("hard") || sf.includes("carpet") ? "hard" : "none";
  const num = (t.level || "").match(/(\d+)$/);
  const badge = num
    ? `<span class="lvl pill t${num[1]} ${t.tour}">${t.tour}<small>${num[1]}</small></span>`
    : `<span class="lvl mark ${t.tour}">${t.tour}</span>`;
  const day = `${t.startDate.slice(8)} ${MONTHS[+t.startDate.slice(5, 7) - 1]}`;
  return `<span class="tile ${surface} ${t.tour}" aria-hidden="true">
    <span class="tile-top ${size}">${esc(title)}</span>
    <span class="tile-bot">${badge}<span class="tile-date">${day}</span></span>
  </span>`;
}
// Calendar bar label: "WTA 1000", "WTA Finals", "Grand Slam", or just the tour when the source has no level (most ATP events).
const levelLabel = (t) => !t.level ? t.tour : t.level.startsWith(t.tour) || t.level === "Grand Slam" ? t.level : `${t.tour} ${t.level}`;
const ENTRY = { M: "Main draw", Q: "Qualifying", WC: "Wildcards", LL: "Lucky losers", ALT: "Alternates", PR: "Protected ranking", SE: "Special exempt" };

async function load() {
  $("#list").innerHTML = '<div class="status">Loading tournaments…</div>';
  try {
    $("#yearLabel").textContent = state.year;
    const r = await fetch(`/api/tournaments?from=${state.year}-01-01&to=${state.year}-12-31`);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    state.tournaments = data.tournaments;
    if (data.errors.length) console.warn(data.errors);
    state.months = rangeMonths();
    if (state.month && !state.months.includes(state.month)) state.month = "";
    render();
  } catch (e) {
    $("#list").innerHTML = `<div class="status">Couldn't load tournaments: ${esc(e.message)}</div>`;
  }
}

function matches(t, q) {
  if (!q) return true;
  const hay = [t.name, t.city, t.country, t.level, t.surface].join(" ").toLowerCase();
  if (hay.includes(q)) return true;
  const p = state.players.get(key(t));
  return !!p && [...p.singles, ...p.doubles].some((e) => e.names.join(" ").toLowerCase().includes(q));
}

// Months (YYYY-MM) of the selected year.
const rangeMonths = () => Array.from({ length: 12 }, (_, i) => `${state.year}-${String(i + 1).padStart(2, "0")}`);

// Tournament type across both tours: "1000" covers WTA 1000 and ATP Masters 1000, etc.
function tier(t) {
  if (t.level === "Grand Slam") return "gs";
  if (/finals/i.test(t.level || "")) return "finals";
  const n = (t.level || "").match(/(\d+)$/);
  return n ? n[1] : "";
}

// Type chips offered under each tour tab, as [tier, label].
const TYPES = {
  ALL: [["gs", "Grand Slam"], ["1000", "1000"], ["500", "500"], ["250", "250"], ["125", "125"], ["finals", "Finals"]],
  ATP: [["gs", "Grand Slam"], ["1000", "Masters 1000"], ["500", "ATP 500"], ["250", "ATP 250"], ["finals", "Finals"]],
  WTA: [["gs", "Grand Slam"], ["1000", "WTA 1000"], ["500", "WTA 500"], ["250", "WTA 250"], ["125", "WTA 125"], ["finals", "Finals"]],
};

const TYPE_ICONS = {
  all: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" style="color:var(--muted)">
    <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/>
    <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>`,
  trophy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--gold)">
    <path d="M7 4h10v5a5 5 0 0 1-10 0V4z" fill="currentColor" fill-opacity=".25"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/>
    <path d="M12 14v4M8 20h8"/></svg>`,
  star: `<svg viewBox="0 0 24 24" fill="currentColor" fill-opacity=".25" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" style="color:var(--ink)">
    <path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>`,
};

function renderTypeChips(pool) {
  const types = TYPES[state.tour];
  if (state.type && !types.some(([v]) => v === state.type)) state.type = "";
  const icon = (v) =>
    v === "" ? TYPE_ICONS.all
    : v === "gs" ? TYPE_ICONS.trophy
    : v === "finals" ? TYPE_ICONS.star
    : `<span class="num" style="--tc:var(--t${v})"><b>${v}</b></span>`;
  // Number tiles already show the level, so their caption names the tour instead.
  const caption = (v, label) => !/^\d+$/.test(v) ? label
    : state.tour === "ALL" ? "WTA & ATP" : state.tour === "ATP" && v === "1000" ? "ATP Masters" : state.tour;
  const chip = (v, label, n) =>
    `<button data-type="${v}" aria-pressed="${state.type === v}" class="${n ? "" : "empty"}" aria-label="${esc(label)}, ${n} tournaments">
      <span class="n">${n}</span><span class="ico">${icon(v)}</span><span class="lbl">${esc(caption(v, label))}</span></button>`;
  $("#typeChips").dataset.tour = state.tour;
  $("#typeChips").innerHTML = chip("", "All types", pool.length)
    + types.map(([v, label]) => chip(v, label, pool.filter((t) => tier(t) === v).length)).join("");
}

// Each tournament belongs to exactly one month: the month it starts in (Sep 28 – Oct 4 is September).
// One that started the previous year (e.g. a late-December start) goes under January of the year shown.
const monthOf = (t) => (t.startDate.slice(0, 4) < String(state.year) ? `${state.year}-01` : t.startDate.slice(0, 7));
const inMonth = (t, m) => monthOf(t) === m;
const monthTitle = (m) => fmt(m + "-01", { month: "long", year: "numeric" }) + (m < thisMonth ? '<span class="arch">Archive</span>' : "");

// Month tiles: All, then each month in order; earlier months are the archive. Counts follow the other filters.
function renderMonthTiles(q) {
  const base = state.tournaments.filter((t) => (state.tour === "ALL" || t.tour === state.tour) && matches(t, q)
    && (!state.type || tier(t) === state.type));
  const years = new Set(state.months.map((m) => m.slice(0, 4)));
  const tile = (m) => {
    const n = base.filter((t) => inMonth(t, m)).length;
    const cls = [m < thisMonth ? "arch" : "", m === thisMonth ? "now" : "", n ? "" : "empty"].join(" ");
    const label = fmt(m + "-01", { month: "long", year: "numeric" }) + (m < thisMonth ? ", archive" : m === thisMonth ? ", this month" : "");
    return `<button data-month="${m}" class="${cls}" aria-pressed="${state.month === m}" aria-label="${esc(label)}, ${n} tournaments">
      <span class="n">${n}</span><span class="mo">${MONTHS[+m.slice(5) - 1]}</span><span class="yr">${m.slice(0, 4)}</span></button>`;
  };
  const archive = state.months.filter((m) => m < thisMonth), rest = state.months.filter((m) => m >= thisMonth);
  $("#monthStrip").innerHTML =
    `<button data-month="" aria-pressed="${state.month === ""}" aria-label="All months, ${base.length} tournaments">
      <span class="n">${base.length}</span><span class="mo">All</span><span class="yr">${years.size === 1 ? [...years][0] : "months"}</span></button>`
    + (archive.length ? `<span class="tag">Archive</span>${archive.map(tile).join("")}<span class="sep"></span>` : "")
    + rest.map(tile).join("");
  if (!scrolledToMonth) {
    scrolledToMonth = true;
    // Scroll only if the selected month is off-screen to the right, so the strip otherwise starts at "All".
    const strip = $("#monthStrip"), sel = strip.querySelector('[aria-pressed="true"]');
    const overflow = sel ? sel.getBoundingClientRect().right - strip.getBoundingClientRect().right : 0;
    if (overflow > 0) strip.scrollLeft += overflow + 40;
  }
}

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const month = state.month;
  renderMonthTiles(q);
  // Tour tile counts: tournaments matching the search and month, before the tour and type filters.
  const counted = state.tournaments.filter((t) => matches(t, q) && (!month || inMonth(t, month)));
  document.querySelectorAll("#tourSeg button").forEach((b) => {
    b.querySelector(".n").textContent = counted.filter((t) => b.dataset.tour === "ALL" || t.tour === b.dataset.tour).length;
  });
  const pool = state.tournaments.filter((t) => (state.tour === "ALL" || t.tour === state.tour) && matches(t, q)
    && (!month || inMonth(t, month)));
  renderTypeChips(pool);
  const list = pool.filter((t) => !state.type || tier(t) === state.type);
  if (!list.length) { $("#list").innerHTML = '<div class="status">No tournaments match.</div>'; return; }
  $("#list").innerHTML = state.view === "calendar" ? renderCalendar(list, q) : renderList(list, q);
}

function renderList(list, q) {
  // Group by start month, so each tournament appears under one heading only.
  const months = new Map();
  for (const t of list) {
    const m = monthOf(t);
    if (!months.has(m)) months.set(m, []);
    months.get(m).push(t);
  }
  return [...months].map(([m, ts]) => `
    <section class="month">
      <h2>${monthTitle(m)}<span class="count">${ts.length} tournament${ts.length === 1 ? "" : "s"}</span></h2>
      ${ts.map((t) => cardHTML(t, q)).join("")}
    </section>`).join("");
}

function cardHTML(t, q) {
  const now = localDay(today);
  const status = t.endDate < now ? ["done", "Completed"] : t.startDate <= now ? ["live", "In progress"] : ["next", "Upcoming"];
  const k = key(t);
  return `<article class="card st-${status[0]} ${state.open.has(k) ? "open" : ""} ${status[0] === "done" ? "past" : ""}" data-key="${esc(k)}">
    <button aria-expanded="${state.open.has(k)}">
      ${tileHTML(t)}
      <span>
        <div class="name">${esc(t.name)}</div>
        <div class="meta">
          <span>📍 ${esc([t.city, t.country].filter(Boolean).join(", ") || "TBA")}</span>
          <span>${esc(levelLabel(t))}</span>
          ${t.surface ? `<span>${esc(t.surface)}</span>` : ""}
          ${t.prizeMoney ? `<span>${esc(t.prizeMoney)}</span>` : ""}
        </div>
      </span>
      <span class="dates">${fmt(t.startDate, { month: "short", day: "numeric" })} – ${fmt(t.endDate, { month: "short", day: "numeric" })}<span class="chev">›</span>
        <br><span class="status-pill">${status[1]}</span></span>
    </button>
    <div class="detail">${state.open.has(k) ? renderPlayers(t, q) : ""}</div>
  </article>`;
}

// Day arithmetic on YYYY-MM-DD strings, done in UTC so DST never shifts a day.
const dayNum = (d) => Date.parse(d + "T00:00:00Z") / 864e5;
const numDay = (n) => new Date(n * 864e5).toISOString().slice(0, 10);

function renderCalendar(list, q) {
  const now = localDay(today);
  const months = state.month ? [state.month] : rangeMonths();
  const weekdays = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d) => `<span>${d}</span>`).join("");
  const sel = state.selected && list.find((t) => key(t) === state.selected.key);

  const monthHTML = (ym) => {
    const first = dayNum(ym + "-01");
    const last = dayNum(numDay(dayNum(ym + "-28") + 4).slice(0, 7) + "-01") - 1;
    let weekStart = first - ((new Date(first * 864e5).getUTCDay() + 6) % 7);
    const monthEvents = list.filter((t) => dayNum(t.startDate) <= last && dayNum(t.endDate) >= first);
    let weeks = "";
    for (; weekStart <= last; weekStart += 7) {
      const weekEnd = weekStart + 6;
      let cells = "";
      for (let i = 0; i < 7; i++) {
        const d = numDay(weekStart + i);
        cells += `<div class="cal-day ${d.slice(0, 7) !== ym ? "out" : ""} ${d === now ? "today" : ""}" style="grid-column:${i + 1}"><span>${+d.slice(8)}</span></div>`;
      }
      // Stack overlapping tournaments into lanes: each takes the first lane that's free from its start column.
      const evs = monthEvents
        .filter((t) => dayNum(t.startDate) <= weekEnd && dayNum(t.endDate) >= weekStart)
        .sort((a, b) => a.startDate.localeCompare(b.startDate) || b.endDate.localeCompare(a.endDate) || a.tour.localeCompare(b.tour));
      const lanes = [];
      for (const t of evs) {
        const s0 = Math.max(0, dayNum(t.startDate) - weekStart), e0 = Math.min(6, dayNum(t.endDate) - weekStart);
        let lane = lanes.findIndex((end) => end < s0);
        if (lane === -1) lane = lanes.length;
        lanes[lane] = e0;
        const cls = [t.tour, t.endDate < now ? "past" : "", dayNum(t.startDate) < weekStart ? "cl" : "", dayNum(t.endDate) > weekEnd ? "cr" : "",
          state.selected && state.selected.key === key(t) && state.selected.month === ym ? "sel" : ""].join(" ");
        const title = `${levelLabel(t)} · ${t.name} · ${[t.city, t.country].filter(Boolean).join(", ")} · ${fmt(t.startDate, { month: "short", day: "numeric" })} – ${fmt(t.endDate, { month: "short", day: "numeric" })}`;
        cells += `<button class="cal-ev ${cls}" data-key="${esc(key(t))}" data-month="${ym}" title="${esc(title)}"
          style="grid-column:${s0 + 1} / ${e0 + 2};grid-row:${lane + 2}"><small>${esc(levelLabel(t))}</small>${esc(t.name)}</button>`;
      }
      weeks += `<div class="cal-week">${cells}</div>`;
    }
    const count = list.filter((t) => inMonth(t, ym)).length;
    return `<section class="month">
      <h2>${monthTitle(ym)}<span class="count">${count} tournament${count === 1 ? "" : "s"}</span></h2>
      <div class="cal"><div class="cal-head">${weekdays}</div>${weeks}</div>
      ${sel && state.selected.month === ym ? cardHTML(sel, q) : ""}
    </section>`;
  };
  return `<div class="legend"><span><i style="background:var(--atp)"></i>ATP</span><span><i style="background:var(--wta)"></i>WTA</span><span>Click a tournament for details and players</span></div>`
    + months.map(monthHTML).join("");
}

function renderPlayers(t, q) {
  const link = `<span class="note">ID ${esc(t.tour)} ${esc(t.id)}${t.year ? ` · ${esc(t.year)}` : ""}</span>`
    + (t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">Official page ↗</a>` : "")
    + (state.editable ? `<button class="del-btn" data-del="${esc(key(t))}">Delete</button>` : "");
  const k = key(t), p = state.players.get(k), busy = state.loading.has(k);
  if (!p) return `<div class="detail-top"><span class="note">Loading player list…</span>${link}</div>`;
  const time = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const upd = `<span class="upd">
      <button class="upd-btn" data-upd="${esc(k)}" ${busy ? "disabled" : ""}>${busy ? "Updating…" : "↻ Update"}</button>
      ${p.at ? `<span class="note" title="Reloads by itself every ${UPDATE_MIN} minutes while open">Updated ${time(p.at)}${p.updateError ? ` · update failed: ${esc(p.updateError)}` : ""}</span>` : ""}
    </span>`;
  if (p.error) return `<div class="detail-top"><span class="note">Couldn't load players: ${esc(p.error)}</span>${upd}${link}</div>`;
  const ch = p.changes, added = new Set(ch ? ch.added.map((e) => e.id) : []);
  const names = (es) => es.map((e) => esc(e.names.join(" / "))).join(", ");
  const changes = !p.base ? "" : `<div class="changes">${ch.removed.length + ch.added.length + ch.moved.length
    ? `<p><b>Changes since ${time(p.base.at)}</b></p>`
      + (ch.removed.length ? `<p class="out"><b>Withdrawn (${ch.removed.length}):</b> ${names(ch.removed)}</p>` : "")
      + (ch.added.length ? `<p class="in"><b>Added (${ch.added.length}):</b> ${names(ch.added)}</p>` : "")
      + (ch.moved.length ? `<p><b>Moved:</b> ${ch.moved.map((m) => `${esc(m.names.join(" / "))} (${esc(ENTRY[m.from] || m.from || "–")} → ${esc(ENTRY[m.to] || m.to || "–")})`).join(", ")}</p>` : "")
    : `<p>No changes since ${time(p.base.at)}.</p>`}</div>`;
  const hl = (s) => q ? esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), (m) => `<mark>${m}</mark>`) : esc(s);
  // Photos: one per player, initials until a photo is found or when there's none. Hovering shows the
  // photo's credit; a Wikimedia Commons photo links to its file page (author and license).
  const initials = (n) => n.split(/[\s-]+/).filter(Boolean).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  const faces = (e) => !state.photosOn ? "" : `<span class="faces">${e.names.map((n, i) => {
    const f = e.ids && e.ids[i] && state.photos[`${t.tour}-${e.ids[i]}`];
    if (!f) return `<span class="ini" title="${esc(n)}">${esc(initials(n))}</span>`;
    const img = `<img src="${esc(f.src)}" alt="" title="${esc(n + (f.credit ? ` · ${f.credit}` : ""))}" loading="lazy" referrerpolicy="no-referrer">`;
    return f.link ? `<a href="${esc(f.link)}" target="_blank" rel="noopener">${img}</a>` : img;
  }).join("")}</span>`;
  const block = (title, entries) => {
    if (!entries.length) return "";
    const groups = new Map();
    for (const e of entries) {
      const g = ENTRY[e.entry] || (e.entry ? e.entry : "");
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(e);
    }
    const order = Object.values(ENTRY);
    const rank = (g) => (order.includes(g) ? order.indexOf(g) : order.length);
    return [...groups].sort((a, b) => rank(a[0]) - rank(b[0])).map(([g, es]) => `
      <div class="group-title">${esc(title)}${g ? ` · ${esc(g)}` : ""} (${es.length})</div>
      <ul class="players${state.photosOn ? " with-photos" : ""}">${es
        .sort((a, b) => (+a.seed || 999) - (+b.seed || 999) || a.names[0].localeCompare(b.names[0]))
        .map((e) => `<li>${faces(e)}<span class="cc">${esc(e.countries.filter(Boolean).join("/"))}</span><span>${hl(e.names.join(" / "))}</span>${added.has(entryId(title, e)) ? '<span class="new">New</span>' : ""}${e.seed ? `<span class="seed">[${esc(e.seed)}]</span>` : ""}</li>`)
        .join("")}</ul>`).join("");
  };
  const total = p.singles.length + p.doubles.length;
  return `<div class="detail-top"><span class="note">Source: ${esc(p.source)}</span>${upd}${link}</div>
    ${changes}${total ? block("Singles", p.singles) + block("Doubles", p.doubles)
      : `<p class="note">No player list published yet. Check back closer to the start date.</p>`}`;
}

async function toggle(card) {
  const k = card.dataset.key;
  if (state.open.has(k)) {
    state.open.delete(k);
    if (state.view === "calendar") state.selected = null;
    render();
    return;
  }
  state.open.add(k);
  render();
  loadPlayers(k);
}

function select(btn) {
  const k = btn.dataset.key, month = btn.dataset.month;
  if (state.selected && state.selected.key === k && state.selected.month === month) {
    state.selected = null;
    render();
    return;
  }
  state.selected = { key: k, month };
  state.open.add(k);
  render();
  document.querySelector(`.month .card[data-key="${CSS.escape(k)}"]`)?.scrollIntoView({ behavior: "smooth", block: "nearest" });
  loadPlayers(k);
}

// Player lists change as players withdraw or get in from the alternates list. A list is reloaded when Update
// is clicked (fresh: skips the server's cache), and once it's UPDATE_MIN minutes old: when reopened, or by
// itself while open (for tournaments not yet finished). Changes are counted against the first list loaded this visit.
const UPDATE_MIN = 60;
const entryId = (event, e) => `${event}|${e.names.join("/")}`;
function diffPlayers(base, cur) {
  const index = (p) => new Map([...p.singles.map((e) => [entryId("Singles", e), e]), ...p.doubles.map((e) => [entryId("Doubles", e), e])]);
  const a = index(base), b = index(cur);
  return {
    removed: [...a].filter(([id]) => !b.has(id)).map(([id, e]) => ({ id, ...e })),
    added: [...b].filter(([id]) => !a.has(id)).map(([id, e]) => ({ id, ...e })),
    moved: [...b].filter(([id, e]) => a.has(id) && (a.get(id).entry || "") !== (e.entry || ""))
      .map(([id, e]) => ({ id, names: e.names, from: a.get(id).entry, to: e.entry })),
  };
}

async function loadPlayers(k, fresh = false) {
  const prev = state.players.get(k);
  if (state.loading.has(k) || (!fresh && prev && !prev.error && Date.now() - prev.at < UPDATE_MIN * 60e3)) return;
  const t = state.tournaments.find((x) => key(x) === k);
  if (!t) return;
  state.loading.add(k);
  if (prev) render();
  const params = new URLSearchParams({ tour: t.tour, id: t.id, year: t.year, start: t.startDate, end: t.endDate });
  if (fresh) params.set("fresh", "1");
  const ok = prev && !prev.error ? prev : null;
  try {
    const r = await fetch(`/api/players?${params}`, fresh ? { cache: "no-store" } : undefined);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
    data.at = Date.now();
    if (ok) {
      data.base = ok.base || { singles: ok.singles, doubles: ok.doubles, at: ok.at };
      data.changes = diffPlayers(data.base, data);
    }
    state.players.set(k, data);
    loadPhotos(t, data);
  } catch (e) {
    // Keep the list already shown if an update fails.
    state.players.set(k, ok ? { ...ok, updateError: e.message } : { error: e.message, at: Date.now() });
  }
  state.loading.delete(k);
  render();
}

// Player photos. The local server saves each player's photo in photos/ the first time it's needed and
// reports how many are still being looked up, so this asks again until they're all done. The live site
// answers from its published list of photo addresses (vercel-deploy/data/photos.json).
async function loadPhotos(t, list, tries = 0) {
  if (state.photosOn === false) return;
  const players = [...list.singles, ...list.doubles]
    .flatMap((e) => (e.ids || []).map((id, i) => (id ? { tour: t.tour, id, name: e.names[i] } : null)).filter(Boolean));
  if (!players.length) return;
  try {
    const r = await fetch("/api/photos", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ players }) });
    if (!r.ok) { state.photosOn = false; return; }
    const d = await r.json();
    const first = !state.photosOn, before = Object.keys(state.photos).length;
    state.photosOn = true;
    Object.assign(state.photos, d.photos);
    if (first || Object.keys(state.photos).length !== before) render();
    if (d.pending && tries < 100) setTimeout(() => loadPhotos(t, list, tries + 1), 3000);
  } catch {}
}

// Hourly update: reload lists on screen once they're UPDATE_MIN minutes old, while the page is visible.
// Finished tournaments are skipped; their lists no longer change.
function autoTick() {
  if (document.hidden) return;
  for (const btn of document.querySelectorAll("[data-upd]")) {
    const k = btn.dataset.upd, t = state.tournaments.find((x) => key(x) === k);
    if (!t || t.endDate < localDay(new Date())) continue;
    const p = state.players.get(k);
    if (!p || Date.now() - (p.at || 0) >= UPDATE_MIN * 60e3) loadPlayers(k, true);
  }
}
setInterval(autoTick, 60e3);
document.addEventListener("visibilitychange", autoTick);

// ---------------------------------------------------------------- Local editing (hidden tournaments)
// The local server answers /api/hidden with editable: true; the live site has no such route, so nothing shows there.

async function loadHidden() {
  try {
    const r = await fetch("/api/hidden");
    const data = r.ok ? await r.json() : { editable: false, tournaments: [] };
    state.editable = !!data.editable;
    state.hidden = data.tournaments || [];
  } catch { state.editable = false; state.hidden = []; }
  renderHiddenPanel();
}

function renderHiddenPanel() {
  const btn = $("#hiddenBtn"), panel = $("#hiddenPanel");
  btn.hidden = !state.editable;
  btn.textContent = `Hidden (${state.hidden.length})`;
  const open = state.editable && btn.getAttribute("aria-expanded") === "true";
  panel.hidden = !open;
  if (!open) return;
  panel.innerHTML = `<h2>Deleted tournaments</h2>` + (state.hidden.length
    ? `<ul>${state.hidden.map((h, i) => `<li><span><strong>${esc(h.name || `${h.tour} ${h.id}`)}</strong>
        <span class="note">ID ${esc(h.tour)} ${esc(h.id)}${h.year ? ` · ${esc(h.year)}` : " · every year"}${h.note ? ` · ${esc(h.note)}` : ""}</span></span>
        <button class="restore-btn" data-restore="${i}">Restore</button></li>`).join("")}</ul>`
    : `<p class="note">Nothing deleted. Use Delete in a tournament's details to remove it.</p>`);
}

async function deleteTournament(t) {
  const entry = { tour: t.tour, id: t.id, year: t.year, name: t.name };
  try {
    const r = await fetch("/api/hidden", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(entry) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    state.hidden = data.tournaments;
  } catch (e) { return toast(`Couldn't delete: ${e.message}`); }
  state.tournaments = state.tournaments.filter((x) => key(x) !== key(t));
  state.open.delete(key(t));
  if (state.selected && state.selected.key === key(t)) state.selected = null;
  renderHiddenPanel();
  render();
  toast(`Deleted ${t.name}`, () => restore(entry));
}

async function restore(entry) {
  const params = new URLSearchParams({ tour: entry.tour, id: entry.id });
  if (entry.year != null) params.set("year", entry.year);
  try {
    const r = await fetch(`/api/hidden?${params}`, { method: "DELETE" });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    state.hidden = data.tournaments;
  } catch (e) { return toast(`Couldn't restore: ${e.message}`); }
  renderHiddenPanel();
  load();
}

let toastTimer;
function toast(text, undo, label = "Undo") {
  document.querySelector(".toast")?.remove();
  clearTimeout(toastTimer);
  const el = document.createElement("div");
  el.className = "toast";
  el.setAttribute("role", "status");
  el.innerHTML = `<span>${esc(text)}</span>${undo ? `<button>${esc(label)}</button>` : ""}`;
  if (undo) el.querySelector("button").addEventListener("click", () => { el.remove(); undo(); });
  document.body.append(el);
  toastTimer = setTimeout(() => el.remove(), 6000);
}

new ResizeObserver(([e]) => document.documentElement.style.setProperty("--controls-h",
  getComputedStyle(e.target).position === "sticky" ? `${e.target.getBoundingClientRect().height}px` : "1px"))
  .observe(document.querySelector(".controls"));
// ---------------------------------------------------------------- In-app player alerts
// While the site is open (even in a background tab), once an hour it checks the player lists of every
// tournament starting within WATCH_DAYS days, compares each with the list saved in this browser at the
// previous check, and records any change as an alert: a toast, the Alerts list, and a desktop notification
// if allowed. Lists and alerts are kept in this browser only; the first check of a tournament just saves it.
const WATCH_DAYS = 15, WATCH_MIN = 60, MAX_ALERTS = 50;
const saved = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
state.alerts = saved.get("playerAlerts", []);
let watching = false;

async function watchPlayers(force = false) {
  if (watching || (!force && Date.now() - saved.get("watchAt", 0) < WATCH_MIN * 60e3)) return;
  watching = true;
  saved.set("watchAt", Date.now()); // set first, so another open tab doesn't run the same check
  try {
    const from = localDay(new Date()), to = numDay(dayNum(from) + WATCH_DAYS);
    const r = await fetch(`/api/tournaments?from=${from}&to=${to}`);
    if (!r.ok) return;
    const list = (await r.json()).tournaments.filter((t) => t.startDate >= from && t.startDate <= to);
    const snaps = saved.get("playerSnapshots", {});
    const found = [];
    for (const t of list) {
      const k = key(t);
      const params = new URLSearchParams({ tour: t.tour, id: t.id, year: t.year, start: t.startDate, end: t.endDate });
      let p;
      try {
        const res = await fetch(`/api/players?${params}`);
        if (!res.ok) continue;
        p = await res.json();
      } catch { continue; }
      const slim = (es) => es.map((e) => ({ names: e.names, entry: e.entry || "" }));
      const prev = snaps[k];
      snaps[k] = { end: t.endDate, singles: slim(p.singles), doubles: slim(p.doubles) };
      if (!prev) continue;
      const ch = diffPlayers(prev, p);
      if (!ch.removed.length && !ch.added.length && !ch.moved.length) continue;
      const who = (es) => es.map((e) => e.names.join(" / "));
      // A list that was empty is newly published: keep just the count, not every name.
      const published = !prev.singles.length && !prev.doubles.length ? ch.added.length : 0;
      found.push({ key: k, name: t.name, level: levelLabel(t), start: t.startDate, end: t.endDate, at: Date.now(), unread: true,
        published, removed: who(ch.removed), added: published ? [] : who(ch.added),
        moved: ch.moved.map((m) => ({ names: m.names.join(" / "), from: m.from || "", to: m.to || "" })) });
    }
    for (const k in snaps) if (snaps[k].end < from) delete snaps[k]; // forget finished tournaments
    saved.set("playerSnapshots", snaps);
    saved.set("watchInfo", { at: Date.now(), count: list.length });
    if (found.length) {
      state.alerts = [...found, ...saved.get("playerAlerts", [])].slice(0, MAX_ALERTS);
      saved.set("playerAlerts", state.alerts);
      const names = found.map((a) => a.name).join(", ");
      toast(`Player list changes: ${names}`, () => openAlerts(true), "Show");
      if ("Notification" in window && Notification.permission === "granted") {
        try { new Notification("Player list changes", { body: names }); } catch {}
      }
    }
    renderAlerts();
  } catch (e) {
    console.warn("Player alert check failed", e);
  } finally {
    watching = false;
  }
}

// An alert's differences, one chip per player: withdrawn (red, struck through), added (green, +),
// moved between draws (amber, from → to).
function alertText(a) {
  if (a.published) return `<div class="diff in"><span class="kind">Published</span><span class="chip"><b>+</b>${a.published} entries</span></div>`;
  const entry = (c) => ENTRY[c] || c || "–";
  const row = (cls, kind, chips) => chips.length ? `<div class="diff ${cls}"><span class="kind">${kind} (${chips.length})</span>${chips.join("")}</div>` : "";
  return row("out", "Withdrawn", a.removed.map((n) => `<span class="chip"><b>−</b><span>${esc(n)}</span></span>`))
    + row("in", "Added", a.added.map((n) => `<span class="chip"><b>+</b>${esc(n)}</span>`))
    + row("mv", "Moved", a.moved.map((m) => `<span class="chip">${esc(m.names)} <i>${esc(entry(m.from))} → ${esc(entry(m.to))}</i></span>`));
}

// Folded alerts show one line of counts. Unless folded or unfolded by hand, new alerts are unfolded and
// read ones folded.
const isFolded = (a) => (a.folded === undefined ? !a.unread : a.folded);
function alertSummary(a) {
  if (a.published) return `<div class="sum"><span class="in">+${a.published} published</span></div>`;
  const parts = [
    a.removed.length && `<span class="out">−${a.removed.length} withdrawn</span>`,
    a.added.length && `<span class="in">+${a.added.length} added</span>`,
    a.moved.length && `<span class="mv">${a.moved.length} moved</span>`,
  ].filter(Boolean);
  return `<div class="sum">${parts.join(" · ")}</div>`;
}

function setRead(indexes, read) {
  for (const i of indexes) if (state.alerts[i]) state.alerts[i] = { ...state.alerts[i], unread: !read };
  saved.set("playerAlerts", state.alerts);
  renderAlerts();
}

function renderAlerts() {
  const btn = $("#alertsBtn"), panel = $("#alertsPanel");
  const unread = state.alerts.filter((a) => a.unread).length;
  btn.innerHTML = `🔔 Alerts${unread ? `<span class="badge">${unread}</span>` : ""}`;
  btn.setAttribute("aria-label", `Player alerts, ${unread} new`);
  const open = btn.getAttribute("aria-expanded") === "true";
  panel.hidden = !open;
  if (!open) return;
  const info = saved.get("watchInfo", null);
  const when = (ms) => new Date(ms).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  const canAsk = "Notification" in window && Notification.permission === "default";
  panel.innerHTML = `<div class="alerts-head"><h2>Player alerts</h2>
      ${canAsk ? '<button class="restore-btn" data-alerts="notify">Turn on desktop notifications</button>' : ""}
      <button class="restore-btn" data-alerts="check">Check now</button>
      ${unread ? '<button class="restore-btn" data-alerts="read">Mark all read</button>' : ""}
      ${state.alerts.length ? '<button class="restore-btn" data-alerts="clear">Clear all</button>' : ""}
      <button class="restore-btn" data-alerts="close" aria-label="Close player alerts">Close ✕</button></div>
    <p class="note">Checked every hour while this site is open: player lists of tournaments starting within ${WATCH_DAYS} days.
      ${watching ? "Checking now…" : info ? `Last check ${when(info.at)} (${info.count} tournaments).` : "Not checked yet."}</p>`
    + (state.alerts.length
      ? `<ul>${state.alerts.map((a, i) => `<li class="alert ${a.unread ? "unread" : "read"}"><span>
          <span class="alert-title"><button class="fold" data-fold="${i}" aria-expanded="${!isFolded(a)}"
            title="${isFolded(a) ? "Show the changes" : "Fold"}"><span class="chev" aria-hidden="true">▸</span><strong>${esc(a.name)}</strong></button></span>
          <span class="note">${esc(a.level)} · starts ${fmt(a.start, { month: "short", day: "numeric" })} · found ${when(a.at)}</span>
          ${isFolded(a) ? alertSummary(a) : alertText(a)}</span>
          <span class="alert-actions">
            <button class="state${a.unread ? " new" : ""}" data-read="${i}" aria-pressed="${!a.unread}"
              title="${a.unread ? "Mark as read" : "Mark as unread"}">${a.unread ? "New" : "Read"}</button>
            <button class="restore-btn" data-go="${i}">Open</button>
          </span></li>`).join("")}</ul>`
      : `<p class="note">No changes found yet. The first check only saves each list; changes show here from the next check on.</p>`);
}

function openAlerts(open) {
  $("#alertsBtn").setAttribute("aria-expanded", open);
  renderAlerts();
  // Alerts stay New until marked read (its label, Mark all read) or opened.
  if (open) $("#alertsPanel").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

// Open an alert's tournament: its month in the list view, all tours and types, details open.
async function goToTournament(a) {
  state.tour = "ALL"; state.type = ""; $("#q").value = "";
  document.querySelectorAll("#tourSeg button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.tour === "ALL"));
  setView("list");
  state.month = a.start.slice(0, 7);
  if (+a.start.slice(0, 4) !== state.year) { state.year = +a.start.slice(0, 4); await load(); }
  state.open.add(a.key);
  render();
  loadPlayers(a.key, true);
  document.querySelector(`.card[data-key="${CSS.escape(a.key)}"]`)?.scrollIntoView({ behavior: "smooth", block: "start" });
}

$("#alertsBtn").addEventListener("click", (e) => openAlerts(e.currentTarget.getAttribute("aria-expanded") !== "true"));
$("#alertsPanel").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.fold) {
    const i = +b.dataset.fold;
    state.alerts[i] = { ...state.alerts[i], folded: !isFolded(state.alerts[i]) };
    saved.set("playerAlerts", state.alerts);
    renderAlerts();
    return document.querySelector(`[data-fold="${i}"]`)?.focus();
  }
  if (b.dataset.alerts === "close") { openAlerts(false); return $("#alertsBtn").focus(); }
  if (b.dataset.read) return setRead([+b.dataset.read], state.alerts[+b.dataset.read].unread);
  if (b.dataset.go) { setRead([+b.dataset.go], true); return goToTournament(state.alerts[+b.dataset.go]); }
  if (b.dataset.alerts === "read") return setRead(state.alerts.map((_, i) => i), true);
  if (b.dataset.alerts === "clear") { state.alerts = []; saved.set("playerAlerts", []); }
  if (b.dataset.alerts === "notify") await Notification.requestPermission();
  if (b.dataset.alerts === "check") { const run = watchPlayers(true); renderAlerts(); await run; }
  renderAlerts();
});
// Another open tab of the site found changes: show them here too.
window.addEventListener("storage", (e) => {
  if (e.key === "playerAlerts") { state.alerts = saved.get("playerAlerts", []); renderAlerts(); }
});

loadHidden();
load();
renderAlerts();
watchPlayers();
setInterval(watchPlayers, 5 * 60e3); // runs the check once it's WATCH_MIN minutes since the last one
</script>
</body>
</html>
